<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLoop - منصة متابعة الدراسة</title>
    
    <!-- خط تجريدي عصري من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --secondary: #0ea5e9;
            --accent: #10b981;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- AUTHENTICATION SCREEN --- */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: #38bdf8;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        /* --- DASHBOARD SCREEN --- */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-secondary {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 20px;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .stat-card h3 {
            font-size: 34px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
            box-shadow: var(--shadow-md);
        }

        .lesson-subject {
            font-size: 12px;
            font-weight: 800;
            color: #818cf8;
            background: rgba(99, 102, 241, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .lesson-card h4 {
            font-size: 20px;
            font-weight: 700;
        }

        .lesson-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .start-lesson-button {
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s;
        }

        .start-lesson-button:hover {
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
        }

        /* --- MODAL --- */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>StudyLoop</h1>
                <p>منصتك الذكية لمتابعة الدراسة والتكرار المتباعد</p>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">كلمة المرور</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">تسجيل الدخول</button>
                </form>
                <div class="auth-toggle">
                    ليس لديك حساب؟ <button id="showRegisterButton" type="button">إنشاء حساب جديد</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" hidden>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">الاسم الكامل</label>
                        <input type="text" id="registerName" placeholder="اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">البريد الإلكتروني</label>
                        <input type="email" id="registerEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">كلمة المرور</label>
                        <input type="password" id="registerPassword" placeholder="6 أحرف على الأقل" required>
                    </div>
                    <button type="submit" class="btn-primary">إنشاء الحساب</button>
                </form>
                <div class="auth-toggle">
                    لديك حساب بالفعل؟ <button id="showLoginButton" type="button">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD SCREEN -->
    <div id="app" hidden>
        <header>
            <h2>StudyLoop</h2>
            <div class="user-info">
                <span id="userName">المستخدم</span>
                <button id="logoutButton" class="btn-secondary" type="button">خروج</button>
            </div>
        </header>

        <main class="container">
            <h2 id="welcomeText" style="margin-bottom: 24px; font-size: 28px;">مرحبًا بك 👋</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalLessons">0</h3>
                    <p>إجمالي الدروس</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSubjects">0</h3>
                    <p>المواد الدراسية</p>
                </div>
                <div class="stat-card">
                    <h3 id="reviewLessons">0</h3>
                    <p>قيد المراجعة</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalMinutes">0</h3>
                    <p>إجمالي الدقائق</p>
                </div>
            </div>

            <div class="section-header">
                <h3>جدول الدروس</h3>
                <button id="addLessonButton" class="btn-primary" style="width: auto; padding: 10px 20px;" type="button">+ إضافة درس</button>
            </div>

            <div id="emptyState" class="empty-state">
                <p style="margin-bottom: 16px; color: var(--text-muted); font-size: 16px;">لا توجد دروس مضافة حتى الآن.</p>
                <button id="emptyAddButton" class="btn-secondary" type="button">إضافة أول درس</button>
            </div>

            <div id="lessonsList" class="lessons-grid" hidden></div>
        </main>
    </div>

    <!-- ADD LESSON MODAL -->
    <div id="lessonModal" class="modal-backdrop" hidden>
        <div class="modal">
            <div class="modal-header">
                <h3>إضافة درس جديد</h3>
                <button id="closeModalButton" class="close-btn" type="button">&times;</button>
            </div>
            <form id="lessonForm">
                <div class="form-group">
                    <label for="subjectName">اسم المادة</label>
                    <input type="text" id="subjectName" placeholder="مثال: الرياضيات" required>
                </div>
                <div class="form-group">
                    <label for="lessonName">اسم الدرس</label>
                    <input type="text" id="lessonName" placeholder="مثال: التكامل المباشر" required>
                </div>
                <div class="form-group">
                    <label for="studyDuration">مدة الدراسة (بالدقائق)</label>
                    <input type="number" id="studyDuration" min="1" placeholder="45" required>
                </div>
                <button type="submit" class="btn-primary">حفظ الدرس</button>
            </form>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module" src="app.js?v=3"></script>
</body>
</html>
