<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLoop - منصة متابعة الدراسة</title>
    
    <!-- خطوط عصرية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --btn-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --glass-bg: rgba(17, 24, 39, 0.55);
            --glass-card: rgba(31, 41, 55, 0.4);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-glow: rgba(168, 85, 247, 0.4);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --neon-cyan: #06b6d4;
            --neon-pink: #f43f5e;
            --neon-green: #10b981;
            --radius-2xl: 28px;
            --radius-xl: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- AMBIENT NEON LIGHT BLOBS (الخلفية التفاعلية المتحركة) --- */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.5;
            animation: floatBlob 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #4f46e5;
            top: -100px;
            right: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #ec4899;
            bottom: -150px;
            left: -150px;
            animation-delay: -6s;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            top: 40%;
            left: 30%;
            opacity: 0.25;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        /* --- AUTHENTICATION SCREEN --- */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 48px 36px;
            border-radius: var(--radius-2xl);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--glass-border);
            position: relative;
            transition: border-color 0.4s ease;
        }

        .auth-card:hover {
            border-color: rgba(168, 85, 247, 0.35);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 42px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
            filter: drop-shadow(0 4px 12px rgba(168, 85, 247, 0.3));
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #d1d5db;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(3, 7, 18, 0.5);
            color: #fff;
        }

        .form-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            background: rgba(3, 7, 18, 0.75);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.6);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 26px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: #38bdf8;
            font-weight: 700;
            cursor: pointer;
            margin-right: 4px;
            text-decoration: underline;
        }

        /* --- DASHBOARD HEADER --- */
        header {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 18px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h2 {
            font-weight: 900;
            font-size: 28px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-secondary {
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
            width: 100%;
        }

        /* --- DASHBOARD CARDS & STATS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 28px 22px;
            border-radius: var(--radius-2xl);
            border: 1px solid var(--glass-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-2xl);
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--glass-border-glow);
            box-shadow: 0 20px 45px rgba(168, 85, 247, 0.25);
        }

        .stat-card h3 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 24px;
        }

        .lesson-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 22px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .lesson-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.15);
        }

        .lesson-subject {
            font-size: 12px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 12px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        .lesson-card h4 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }

        .lesson-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .start-lesson-button {
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .start-lesson-button:hover {
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.6);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 70px 24px;
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-2xl);
            border: 2px dashed var(--glass-border);
        }

        /* --- MODAL DIALOGS --- */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1000;
        }

        .modal {
            background: rgba(17, 24, 39, 0.95);
            border-radius: var(--radius-2xl);
            padding: 36px;
            width: 100%;
            max-width: 460px;
            border: 1px solid var(--glass-border-glow);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #fff;
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- الخلفيات النيون التفاعلية -->
    <div class="ambient-light blob-1"></div>
    <div class="ambient-light blob-2"></div>
    <div class="ambient-light blob-3"></div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>StudyLoop</h1>
                <p>منصتك الذكية لمتابعة الدراسة والتكرار المتباعد</p>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">كلمة المرور</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">تسجيل الدخول</button>
                </form>
                <div class="auth-toggle">
                    ليس لديك حساب؟ <button id="showRegisterButton" type="button">إنشاء حساب جديد</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" hidden>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">الاسم الكامل</label>
                        <input type="text" id="registerName" placeholder="اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">البريد الإلكتروني</label>
                        <input type="email" id="registerEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">كلمة المرور</label>
                        <input type="password" id="registerPassword" placeholder="6 أحرف على الأقل" required>
                    </div>
                    <button type="submit" class="btn-primary">إنشاء الحساب</button>
                </form>
                <div class="auth-toggle">
                    لديك حساب بالفعل؟ <button id="showLoginButton" type="button">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD SCREEN -->
    <div id="app" hidden>
        <header>
            <h2>StudyLoop</h2>
            <div class="user-info">
                <span id="userName" style="font-weight: 700; font-size: 15px;">المستخدم</span>
                <button id="logoutButton" class="btn-secondary" type="button">خروج</button>
            </div>
        </header>

        <main class="container">
            <h2 id="welcomeText" style="margin-bottom: 28px; font-size: 30px; font-weight: 900;">مرحبًا بك 👋</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalLessons">0</h3>
                    <p>إجمالي الدروس</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSubjects">0</h3>
                    <p>المواد الدراسية</p>
                </div>
                <div class="stat-card">
                    <h3 id="reviewLessons">0</h3>
                    <p>قيد المراجعة</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalMinutes">0</h3>
                    <p>إجمالي الدقائق</p>
                </div>
            </div>

            <div class="section-header">
                <h3 style="font-size: 22px; font-weight: 800;">جدول الدروس</h3>
                <button id="addLessonButton" class="btn-primary" style="width: auto; padding: 12px 26px;" type="button">+ إضافة درس</button>
            </div>

            <div id="emptyState" class="empty-state">
                <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 16px; font-weight: 600;">لا توجد دروس مضافة حتى الآن.</p>
                <button id="emptyAddButton" class="btn-secondary" type="button">إضافة أول درس</button>
            </div>

            <div id="lessonsList" class="lessons-grid" hidden></div>
        </main>
    </div>

    <!-- ADD LESSON MODAL -->
    <div id="lessonModal" class="modal-backdrop" hidden>
        <div class="modal">
            <div class="modal-header">
                <h3 style="font-size: 20px; font-weight: 800;">إضافة درس جديد</h3>
                <button id="closeModalButton" class="close-btn" type="button">&times;</button>
            </div>
            <form id="lessonForm">
                <div class="form-group">
                    <label for="subjectName">اسم المادة</label>
                    <input type="text" id="subjectName" placeholder="مثال: الرياضيات" required>
                </div>
                <div class="form-group">
                    <label for="lessonName">اسم الدرس</label>
                    <input type="text" id="lessonName" placeholder="مثال: التكامل المباشر" required>
                </div>
                <div class="form-group">
                    <label for="studyDuration">مدة الدراسة (بالدقائق)</label>
                    <input type="number" id="studyDuration" min="1" placeholder="45" required>
                </div>
                <button type="submit" class="btn-primary">حفظ الدرس</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js?v=5"></script>
</body>
</html>
