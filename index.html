<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyLoop | نظم دراستك</title>

    <meta
        name="description"
        content="StudyLoop يساعدك على تنظيم دراستك ومراجعة دروسك في الوقت المناسب."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- التطبيق -->
    <div id="app">

        <!-- الشريط العلوي -->
        <header class="topbar">

            <div class="brand">
                <div class="brand-icon">S</div>

                <div>
                    <h1>StudyLoop</h1>
                    <span>نظم دراستك بذكاء</span>
                </div>
            </div>

            <button class="profile-button" id="profileButton">
                <span class="profile-avatar">👤</span>
            </button>

        </header>


        <!-- المحتوى الرئيسي -->
        <main class="main-content">

            <!-- الترحيب -->
            <section class="welcome-section">

                <div>
                    <p class="welcome-label">مرحبًا بك 👋</p>

                    <h2>
                        جاهز لدراسة
                        <span>اليوم؟</span>
                    </h2>

                    <p class="welcome-description">
                        خطتك الدراسية ومراجعاتك اليومية في مكان واحد.
                    </p>
                </div>

            </section>


            <!-- إحصائيات اليوم -->
            <section class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>

                    <div>
                        <span>وقت الدراسة</span>
                        <strong>0 ساعة</strong>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">📚</div>

                    <div>
                        <span>دروس اليوم</span>
                        <strong>0</strong>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">🔄</div>

                    <div>
                        <span>مراجعات اليوم</span>
                        <strong>0</strong>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">🔥</div>

                    <div>
                        <span>أيام متتالية</span>
                        <strong>0 يوم</strong>
                    </div>
                </div>

            </section>


            <!-- خطة اليوم -->
            <section class="today-section">

                <div class="section-header">

                    <div>
                        <span class="section-label">خطتك</span>
                        <h3>ماذا ستدرس اليوم؟</h3>
                    </div>

                    <button class="add-button" id="addLessonButton">
                        + إضافة درس
                    </button>

                </div>


                <!-- حالة عدم وجود دروس -->
                <div class="empty-state" id="emptyState">

                    <div class="empty-icon">📖</div>

                    <h4>لا توجد دروس بعد</h4>

                    <p>
                        أضف أول درس لك، وسنساعدك في تنظيم مراجعاته.
                    </p>

                    <button id="emptyAddButton">
                        إضافة أول درس
                    </button>

                </div>


                <!-- قائمة الدروس -->
                <div
                    class="lessons-list"
                    id="lessonsList"
                    hidden
                ></div>

            </section>

        </main>


        <!-- التنقل السفلي -->
        <nav class="bottom-navigation">

            <button class="nav-item active">
                <span>🏠</span>
                <small>الرئيسية</small>
            </button>

            <button class="nav-item">
                <span>📚</span>
                <small>المواد</small>
            </button>

            <button class="nav-item">
                <span>📅</span>
                <small>الخطة</small>
            </button>

            <button class="nav-item">
                <span>📊</span>
                <small>التقدم</small>
            </button>

            <button class="nav-item">
                <span>⚙️</span>
                <small>الحساب</small>
            </button>

        </nav>

    </div>


    <!-- نافذة إضافة درس -->
    <div
        class="modal-overlay"
        id="lessonModal"
        hidden
    >

        <div class="modal">

            <div class="modal-header">

                <div>
                    <span class="section-label">درس جديد</span>
                    <h3>أضف درسًا</h3>
                </div>

                <button
                    class="close-button"
                    id="closeModalButton"
                    aria-label="إغلاق"
                >
                    ×
                </button>

            </div>


            <form id="lessonForm">

                <div class="form-group">

                    <label for="subjectName">
                        اسم المادة
                    </label>

                    <input
                        type="text"
                        id="subjectName"
                        placeholder="مثال: الرياضيات"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lessonName">
                        اسم الدرس
                    </label>

                    <input
                        type="text"
                        id="lessonName"
                        placeholder="مثال: المشتقات"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="studyDuration">
                        مدة الدراسة
                    </label>

                    <select id="studyDuration">

                        <option value="25">
                            25 دقيقة
                        </option>

                        <option value="45">
                            45 دقيقة
                        </option>

                        <option value="60">
                            ساعة
                        </option>

                        <option value="90">
                            ساعة ونصف
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    إضافة الدرس
                </button>

            </form>

        </div>

    </div>


    <script src="app.js?v=2"></script>

</body>
</html>
