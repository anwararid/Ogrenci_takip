<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLoop - منصة متابعة الدراسة</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #080b11;
            --card-bg: rgba(18, 24, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-xl: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* --- AUTHENTICATION SCREEN --- */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 2;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            background: rgba(10, 15, 26, 0.6);
            color: #fff;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(10, 15, 26, 0.85);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: #38bdf8;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- DASHBOARD SCREEN --- */
        header {
            background: rgba(15, 22, 35, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h2 {
            font-weight: 800;
            font-size: 24px;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-secondary {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            max-width: 1000px;
            margin: 36px auto;
            padding: 0 20px;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 24px 20px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--card-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card h3 {
            font-size: 36px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .lesson-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .lesson-subject {
            font-size: 11px;
            font-weight: 700;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .lesson-card h4 {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .lesson-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .start-lesson-button {
            padding: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .start-lesson-button:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            border: 2px dashed var(--card-border);
        }

        /* --- MODALS --- */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 7, 13, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal {
            background: #121826;
            border-radius: var(--radius-xl);
            padding: 32px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .close-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>StudyLoop</h1>
                <p>منصتك الذكية لمتابعة الدراسة والتكرار المتباعد</p>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">كلمة المرور</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">تسجيل الدخول</button>
                </form>
                <div class="auth-toggle">
                    ليس لديك حساب؟ <button id="showRegisterButton" type="button">إنشاء حساب جديد</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" hidden>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">الاسم الكامل</label>
                        <input type="text" id="registerName" placeholder="اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">البريد الإلكتروني</label>
                        <input type="email" id="registerEmail" placeholder="example@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">كلمة المرور</label>
                        <input type="password" id="registerPassword" placeholder="6 أحرف على الأقل" required>
                    </div>
                    <button type="submit" class="btn-primary">إنشاء الحساب</button>
                </form>
                <div class="auth-toggle">
                    لديك حساب بالفعل؟ <button id="showLoginButton" type="button">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD SCREEN -->
    <div id="app" hidden>
        <header>
            <h2>StudyLoop</h2>
            <div class="user-info">
                <span id="userName" style="font-weight: 600;">المستخدم</span>
                <button id="logoutButton" class="btn-secondary" type="button">خروج</button>
            </div>
        </header>

        <main class="container">
            <h2 id="welcomeText" style="margin-bottom: 24px; font-size: 26px; font-weight: 700;">مرحبًا بك 👋</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalLessons">0</h3>
                    <p>إجمالي الدروس</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSubjects">0</h3>
                    <p>المواد الدراسية</p>
                </div>
                <div class="stat-card">
                    <h3 id="reviewLessons">0</h3>
                    <p>قيد المراجعة</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalMinutes">0</h3>
                    <p>إجمالي الدقائق</p>
                </div>
            </div>

            <div class="section-header">
                <h3 style="font-size: 20px;">جدول الدروس</h3>
                <button id="addLessonButton" class="btn-primary" style="width: auto; padding: 10px 22px;" type="button">+ إضافة درس</button>
            </div>

            <div id="emptyState" class="empty-state">
                <p style="margin-bottom: 16px; color: var(--text-muted); font-size: 15px;">لا توجد دروس مضافة حتى الآن.</p>
                <button id="emptyAddButton" class="btn-secondary" type="button">إضافة أول درس</button>
            </div>

            <div id="lessonsList" class="lessons-grid" hidden></div>
        </main>
    </div>

    <!-- ADD LESSON MODAL -->
    <div id="lessonModal" class="modal-backdrop" hidden>
        <div class="modal">
            <div class="modal-header">
                <h3 style="font-size: 18px;">إضافة درس جديد</h3>
                <button id="closeModalButton" class="close-btn" type="button">&times;</button>
            </div>
            <form id="lessonForm">
                <div class="form-group">
                    <label for="subjectName">اسم المادة</label>
                    <input type="text" id="subjectName" placeholder="مثال: الرياضيات" required>
                </div>
                <div class="form-group">
                    <label for="lessonName">اسم الدرس</label>
                    <input type="text" id="lessonName" placeholder="مثال: التكامل المباشر" required>
                </div>
                <div class="form-group">
                    <label for="studyDuration">مدة الدراسة (بالدقائق)</label>
                    <input type="number" id="studyDuration" min="1" placeholder="45" required>
                </div>
                <button type="submit" class="btn-primary">حفظ الدرس</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js?v=4"></script>
</body>
</html>
